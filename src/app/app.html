<div class="min-h-dvh lg:flex">
  @if (adminLayout()) {
    <!-- แถบบนสำหรับมือถือ -->
    <header class="sticky top-0 z-30 flex items-center justify-between bg-ink px-4 py-3 text-white lg:hidden">
      <a routerLink="/" class="flex items-center gap-2 font-bold"><span class="text-brand-500">●</span> Rider</a>
      <button type="button" class="rounded-lg px-3 py-1.5 text-sm ring-1 ring-white/30" (click)="menuOpen.set(!menuOpen())" aria-label="เมนู">
        {{ menuOpen() ? 'ปิด' : 'เมนู' }}
      </button>
    </header>

    <!-- แถบข้าง -->
    <aside
      class="bg-ink text-slate-200 lg:sticky lg:top-0 lg:block lg:h-dvh lg:w-64 lg:shrink-0"
      [class.hidden]="!menuOpen()"
    >
      <div class="hidden items-center gap-2 px-6 py-6 text-xl font-bold text-white lg:flex">
        <span class="text-brand-500">●</span> Rider
      </div>
      <p class="hidden px-6 pb-3 text-xs text-slate-400 lg:block">ระบบจัดเส้นทางส่งอาหาร</p>
      <nav class="flex flex-col gap-1 px-3 pb-4">
        @for (item of nav; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-white/10 text-white"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium hover:bg-white/5"
            (click)="menuOpen.set(false)"
          >
            <span class="w-5 text-center text-brand-500">{{ item.icon }}</span>{{ item.label }}
          </a>
        }
      </nav>
    </aside>
  }

  <main class="min-w-0 flex-1 px-4 py-6 sm:px-8 sm:py-8">
    <div class="mx-auto max-w-6xl"><router-outlet /></div>
  </main>
</div>

<!-- แจ้งเตือน -->
<div class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4">
  @for (t of toast.toasts(); track t.id) {
    <div
      class="pointer-events-auto flex max-w-md items-start gap-3 rounded-xl px-4 py-3 text-sm font-medium text-white shadow-lg"
      [class]="t.kind === 'ok' ? 'bg-emerald-600' : 'bg-red-600'"
      role="status"
    >
      <span class="flex-1">{{ t.text }}</span>
      <button type="button" class="opacity-80 hover:opacity-100" aria-label="ปิด" (click)="toast.dismiss(t.id)">✕</button>
    </div>
  }
</div>
